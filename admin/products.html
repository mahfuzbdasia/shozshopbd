<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — SOHOZ SHOP BD Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> SOHOZ SHOP BD Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Dashboard</a>
      <a href="/admin/products.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg> Products</a>
      <a href="/admin/product-settings.html">Product Settings</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/admin/checkout-settings.html">Checkout Settings</a>
      <a href="/admin/orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/></svg> Orders</a>
      <a href="/admin/customers.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg> Customers</a>
      <a href="/admin/coupons.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20v5H2zM12 22V7"/></svg> Coupons</a>
      <a href="/admin/banners.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 21h8M12 16v5"/></svg> Banners</a>
      <a href="/admin/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Messages</a>
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as <strong id="admin-who">Admin</strong></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Products</h1><p>Add, edit, restock or retire watches from the storefront.</p></div>
      <button class="btn btn-primary" id="new-product-btn">+ New product</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <input type="search" class="search-input" id="p-search" placeholder="Search by name or SKU…">
        <select class="filter-select" id="p-category-filter"><option value="">All categories</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th><th>Reference</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
          <tbody id="products-body"><tr class="empty-row"><td colspan="8">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="product-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">New product</h3><button class="modal-close" id="modal-close">&times;</button></div>
    <form id="product-form">
      <input type="hidden" id="pf-id">
      <div class="field"><label for="pf-name">Name</label><input id="pf-name" required></div>
      <div class="field-row">
        <div class="field"><label for="pf-category">Category</label>
          <select id="pf-category" required><option>Classic</option><option>Chronograph</option><option>Diver</option><option>Sport</option><option>Minimalist</option></select>
        </div>
        <div class="field"><label for="pf-movement">Movement</label><input id="pf-movement" placeholder="Automatic"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="pf-price">Price (৳)</label><input id="pf-price" type="number" min="0" required></div>
        <div class="field"><label for="pf-old-price">Old price (optional)</label><input id="pf-old-price" type="number" min="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="pf-case">Case size (mm)</label><input id="pf-case" type="number" min="20" max="60"></div>
        <div class="field"><label for="pf-strap">Strap</label><input id="pf-strap" placeholder="Leather"></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="pf-water">Water resistance</label><input id="pf-water" placeholder="100m"></div>
        <div class="field"><label for="pf-stock">Stock</label><input id="pf-stock" type="number" min="0" required></div>
      </div>
      <div class="field"><label for="pf-image">Image path</label><input id="pf-image" placeholder="/images/products/meridian-steel.svg"></div>
      <div class="field"><label for="pf-desc">Description</label><textarea id="pf-desc" rows="3"></textarea></div>
      <div class="check-row">
        <label><input type="checkbox" id="pf-new"> Mark as New</label>
        <label><input type="checkbox" id="pf-bestseller"> Mark as Bestseller</label>
        <label><input type="checkbox" id="pf-active" checked> Active (visible on storefront)</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Save product</button>
    </form>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
AdminAuth.requireAuth();
let allProducts = [];

function rowHTML(p) {
  return `
    <tr data-id="${p.id}">
      <td><img class="cell-img" src="${p.image}" alt=""></td>
      <td class="mono">${p.sku}</td>
      <td>${p.name}</td>
      <td>${p.category}</td>
      <td class="mono">${fmtBDT(p.price)}</td>
      <td>${p.stock}</td>
      <td><span class="badge badge-${p.is_active ? 'active' : 'inactive'}">${p.is_active ? 'Active' : 'Hidden'}</span></td>
      <td>
        <div class="row-actions">
          <button class="icon-action" data-edit="${p.id}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-action" data-delete="${p.id}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-1 0v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6h10Z"/></svg></button>
        </div>
      </td>
    </tr>`;
}

function renderTable(products) {
  const tbody = document.getElementById('products-body');
  tbody.innerHTML = products.length ? products.map(rowHTML).join('') : '<tr class="empty-row"><td colspan="8">No products match.</td></tr>';
}

function applyFilters() {
  const q = document.getElementById('p-search').value.toLowerCase();
  const cat = document.getElementById('p-category-filter').value;
  const filtered = allProducts.filter((p) =>
    (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)) &&
    (!cat || p.category === cat)
  );
  renderTable(filtered);
}

async function loadProducts() {
  try {
    const res = await fetch('/api/products?limit=200');
    const data = await res.json();
    allProducts = data.products;
    const cats = [...new Set(allProducts.map((p) => p.category))];
    document.getElementById('p-category-filter').innerHTML = '<option value="">All categories</option>' + cats.map((c) => `<option>${c}</option>`).join('');
    renderTable(allProducts);
  } catch (err) {
    showToast('Could not load products', true);
  }
}

document.getElementById('p-search').addEventListener('input', applyFilters);
document.getElementById('p-category-filter').addEventListener('change', applyFilters);

const modal = document.getElementById('product-modal');
const form = document.getElementById('product-form');

function openModal(product) {
  form.reset();
  document.getElementById('modal-title').textContent = product ? `Edit ${product.sku}` : 'New product';
  document.getElementById('pf-id').value = product ? product.id : '';
  document.getElementById('pf-name').value = product ? product.name : '';
  document.getElementById('pf-category').value = product ? product.category : 'Classic';
  document.getElementById('pf-movement').value = product ? product.movement : '';
  document.getElementById('pf-price').value = product ? product.price : '';
  document.getElementById('pf-old-price').value = product && product.old_price ? product.old_price : '';
  document.getElementById('pf-case').value = product ? product.case_mm : '';
  document.getElementById('pf-strap').value = product ? product.strap : '';
  document.getElementById('pf-water').value = product ? product.water_resist : '';
  document.getElementById('pf-stock').value = product ? product.stock : 0;
  document.getElementById('pf-image').value = product ? product.image : '/images/products/meridian-steel.svg';
  document.getElementById('pf-desc').value = product ? product.description : '';
  document.getElementById('pf-new').checked = product ? !!product.is_new : false;
  document.getElementById('pf-bestseller').checked = product ? !!product.is_bestseller : false;
  document.getElementById('pf-active').checked = product ? !!product.is_active : true;
  modal.classList.remove('hidden');
}
document.getElementById('new-product-btn').addEventListener('click', () => openModal(null));
document.getElementById('modal-close').addEventListener('click', () => modal.classList.add('hidden'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('pf-id').value;
  const payload = {
    name: document.getElementById('pf-name').value,
    category: document.getElementById('pf-category').value,
    movement: document.getElementById('pf-movement').value,
    price: Number(document.getElementById('pf-price').value),
    old_price: document.getElementById('pf-old-price').value ? Number(document.getElementById('pf-old-price').value) : null,
    case_mm: Number(document.getElementById('pf-case').value) || null,
    strap: document.getElementById('pf-strap').value,
    water_resist: document.getElementById('pf-water').value,
    stock: Number(document.getElementById('pf-stock').value),
    image: document.getElementById('pf-image').value,
    description: document.getElementById('pf-desc').value,
    is_new: document.getElementById('pf-new').checked,
    is_bestseller: document.getElementById('pf-bestseller').checked,
    is_active: document.getElementById('pf-active').checked,
  };
  try {
    if (id) await adminFetch(`/api/products/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
    else await adminFetch('/api/products', { method: 'POST', body: JSON.stringify(payload) });
    modal.classList.add('hidden');
    showToast('Product saved');
    loadProducts();
  } catch (err) {
    showToast(err.message, true);
  }
});

document.getElementById('products-body').addEventListener('click', (e) => {
  const editBtn = e.target.closest('[data-edit]');
  const delBtn = e.target.closest('[data-delete]');
  if (editBtn) {
    const product = allProducts.find((p) => p.id === Number(editBtn.dataset.edit));
    openModal(product);
  } else if (delBtn) {
    if (!confirm('Delete this product? This cannot be undone.')) return;
    adminFetch(`/api/products/${delBtn.dataset.delete}`, { method: 'DELETE' })
      .then(() => { showToast('Product deleted'); loadProducts(); })
      .catch((err) => showToast(err.message, true));
  }
});

loadProducts();
</script>
</body>
</html>
