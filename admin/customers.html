<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — SOHOZ SHOP BD Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> SOHOZ SHOP BD Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Dashboard</a>
      <a href="/admin/products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg> Products</a>
      <a href="/admin/orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/></svg> Orders</a>
      <a href="/admin/customers.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg> Customers</a>
      <a href="/admin/coupons.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20v5H2zM12 22V7"/></svg> Coupons</a>
      <a href="/admin/banners.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 21h8M12 16v5"/></svg> Banners</a>
      <a href="/admin/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Messages</a>
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as <strong id="admin-who">Admin</strong></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Customers</h1><p>Everyone who has placed at least one order.</p></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <input type="search" class="search-input" id="c-search" placeholder="Search by name or email…">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Orders</th><th>Lifetime value</th><th>Joined</th></tr></thead>
          <tbody id="customers-body"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
AdminAuth.requireAuth();
let allCustomers = [];

function row(c) {
  return `<tr><td>${c.name}</td><td>${c.email}</td><td class="mono">${c.phone || '—'}</td><td>${c.city || '—'}</td><td>${c.order_count}</td><td class="mono">${fmtBDT(c.lifetime_value)}</td><td>${fmtDate(c.created_at)}</td></tr>`;
}
function render(list) {
  document.getElementById('customers-body').innerHTML = list.length ? list.map(row).join('') : '<tr class="empty-row"><td colspan="7">No customers yet.</td></tr>';
}
document.getElementById('c-search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  render(allCustomers.filter((c) => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)));
});

(async function () {
  try {
    allCustomers = await adminFetch('/api/customers');
    render(allCustomers);
  } catch (err) { showToast(err.message, true); }
})();
</script>
</body>
</html>
