<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — SOHOZ SHOP BD Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> SOHOZ SHOP BD Admin</div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Dashboard</a>
      <a href="/admin/products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg> Products</a>
      <a href="/admin/orders.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/></svg> Orders</a>
      <a href="/admin/customers.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg> Customers</a>
      <a href="/admin/coupons.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20v5H2zM12 22V7"/></svg> Coupons</a>
      <a href="/admin/banners.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 21h8M12 16v5"/></svg> Banners</a>
      <a href="/admin/messages.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Messages</a>
    </nav>
    <div class="sidebar-foot">
      <div class="who">Signed in as <strong id="admin-who">Admin</strong></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Orders</h1><p>Track and update order status as items ship.</p></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <input type="search" class="search-input" id="o-search" placeholder="Search by order # or customer…">
        <select class="filter-select" id="o-status-filter">
          <option value="">All statuses</option>
          <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th><th></th></tr></thead>
          <tbody id="orders-body"><tr class="empty-row"><td colspan="9">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="order-modal">
  <div class="modal" style="max-width:560px;">
    <div class="modal-head"><h3 id="om-title">Order</h3><button class="modal-close" id="om-close">&times;</button></div>
    <div id="om-body"></div>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script>
AdminAuth.requireAuth();
let allOrders = [];

function orderRow(o) {
  return `
    <tr data-id="${o.id}">
      <td class="mono">${o.order_no}</td>
      <td>${o.customer_name}</td>
      <td class="mono">${o.customer_phone}</td>
      <td>${o.items_json.reduce((s, i) => s + i.qty, 0)}</td>
      <td class="mono">${fmtBDT(o.total)}</td>
      <td>${o.payment_method}</td>
      <td>
        <select class="filter-select status-select" data-id="${o.id}" style="padding:6px 8px;">
          ${['Pending','Processing','Shipped','Delivered','Cancelled'].map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>${fmtDate(o.created_at)}</td>
      <td><button class="btn btn-outline btn-sm" data-view="${o.id}">View</button></td>
    </tr>`;
}

function renderOrders(orders) {
  document.getElementById('orders-body').innerHTML = orders.length ? orders.map(orderRow).join('') : '<tr class="empty-row"><td colspan="9">No orders match.</td></tr>';
}

function applyFilters() {
  const q = document.getElementById('o-search').value.toLowerCase();
  const status = document.getElementById('o-status-filter').value;
  renderOrders(allOrders.filter((o) =>
    (!q || o.order_no.toLowerCase().includes(q) || o.customer_name.toLowerCase().includes(q)) &&
    (!status || o.status === status)
  ));
}

async function loadOrders() {
  try {
    allOrders = await adminFetch('/api/orders');
    renderOrders(allOrders);
  } catch (err) { showToast(err.message, true); }
}

document.getElementById('o-search').addEventListener('input', applyFilters);
document.getElementById('o-status-filter').addEventListener('change', applyFilters);

document.getElementById('orders-body').addEventListener('change', async (e) => {
  const sel = e.target.closest('.status-select');
  if (!sel) return;
  try {
    await adminFetch(`/api/orders/${sel.dataset.id}/status`, { method: 'PUT', body: JSON.stringify({ status: sel.value }) });
    showToast('Status updated');
    const o = allOrders.find((x) => x.id === Number(sel.dataset.id));
    if (o) o.status = sel.value;
  } catch (err) { showToast(err.message, true); }
});

const modal = document.getElementById('order-modal');
document.getElementById('om-close').addEventListener('click', () => modal.classList.add('hidden'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

document.getElementById('orders-body').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-view]');
  if (!btn) return;
  const o = allOrders.find((x) => x.id === Number(btn.dataset.view));
  document.getElementById('om-title').textContent = `Order ${o.order_no}`;
  document.getElementById('om-body').innerHTML = `
    <p style="font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;">${o.customer_name} · ${o.customer_email} · ${o.customer_phone}</p>
    <p style="font-size:.85rem;margin-bottom:8px;"><strong>Ship to:</strong> ${o.shipping_address}, ${o.city}</p>
    ${o.formatted_address ? `<p style="font-size:.78rem;color:var(--ink-soft);margin-bottom:18px;"><strong>Verified location:</strong> ${o.formatted_address}<br><span class="mono">${Number(o.latitude).toFixed(6)}, ${Number(o.longitude).toFixed(6)}${o.place_id ? ` · Place ${o.place_id}` : ''}</span>${o.google_maps_url ? ` · <a href="${o.google_maps_url}" target="_blank" rel="noopener">Open map</a>` : ''}</p>` : ''}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
        <tbody>${o.items_json.map(i => `<tr><td>${i.name}<div class="mono" style="font-size:.72rem;color:var(--ink-soft);">${i.sku}</div></td><td>${i.qty}</td><td class="mono">${fmtBDT(i.price * i.qty)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div style="margin-top:16px;font-size:.88rem;display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span class="mono">${fmtBDT(o.subtotal)}</span></div>
      ${o.discount ? `<div style="display:flex;justify-content:space-between;"><span>Discount ${o.coupon_code ? '('+o.coupon_code+')' : ''}</span><span class="mono">−${fmtBDT(o.discount)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;"><span>Delivery District</span><span class="mono">${o.delivery_district || o.city || 'Unspecified'}</span></div>
      <div style="display:flex;justify-content:space-between;"><span>Delivery Charge</span><span class="mono">${o.delivery_charge ? fmtBDT(o.delivery_charge) : 'Free'}</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;"><span>Total</span><span class="mono">${fmtBDT(o.total)}</span></div>
    </div>
  `;
  modal.classList.remove('hidden');
});

loadOrders();
</script>
</body>
</html>
